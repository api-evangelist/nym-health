name: Nym Health
description: 'Nym Health provides autonomous medical coding for health systems and physician
  groups. Its Clinical Language Understanding (CLU) engine reads patient charts and assigns
  medical codes automatically with a transparent audit trail for every code, keeping current
  as coding guidelines change and supporting multispecialty environments. Nym is used by 30+
  health systems including Ochsner Health, Inova, Henry Ford and Geisinger, and is backed by
  GV and Lightspeed Venture Partners. As of this enrichment pass Nym publishes no public
  developer portal, API documentation, SDKs, or OpenAPI surface; integrations are handled
  directly with health systems via sales/demo engagement.'
